<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <img src="/public/images/logo.png" alt="Logo de la tienda" class="logo">
            <a href="index.html" class="btn-secondary" target="_blank">Ver tienda</a>
        </div>
        <h1>Panel de Administración</h1>
    </header>
    <a href="/admin-carrusel" class="btn-primary">🖼️ Carrusel</a>    
    <button id="btn-logout" class="btn-danger">Cerrar Sesión</button>

    <main class="container">

        <!-- Formulario para Agregar o Editar Producto -->
        <section class="admin-section">
            <h2 id="form-titulo">Agregar Producto</h2>
            <form id="form-producto" enctype="multipart/form-data">
                <!-- Campo Oculto para almacenar el ID durante la edición -->
                <input type="hidden" id="producto-id">

                <input type="text" id="nombre" name="nombre" placeholder="Nombre del producto" required>
                <input type="number" step="0.01" id="precio" name="precio" placeholder="Precio" required>
                <br><br>
                <!-- Campo Selector de Categoría -->
                <div class="campo-categoria">
                    <label for="select-categoria">Categoría:</label>
                    <select id="select-categoria" name="categoria" required>
                        <option value="" disabled selected>Selecciona una categoría</option>
                        <option value="Calzados">Calzados</option>
                        <option value="Indumentaria">Indumentaria</option>
                        <option value="Electrónica">Electrónica</option>
                        <option value="Hogar">Hogar</option>
                        <option value="__NUEVA__">➕ Nueva categoría...</option>
                    </select>

                    <input type="text" id="nueva-categoria-input" placeholder="Escribe la nueva categoría" style="display: none; margin-top: 8px;">
                </div>
                <br>
                <label for="imagen">Agregar imagen:</label>
                <input type="file" id="imagen" name="imagen" accept="image/*">
                <br>
                <div class="form-acciones" style="margin-top: 10px;">
                    <button type="submit" id="btn-guardar" class="btn-guardar">Guardar Producto</button>
                    <button type="button" id="btn-cancelar" class="btn-danger style="display: none;">Cancelar</button>
                </div>
            </form>
        </section>

        <!-- Tabla de Productos Existentes -->
        <section class="admin-section">
            <h2>Lista de Productos</h2>
            <input type="search" id="buscador-admin" class="buscador-admin" placeholder="🔍 Buscar producto por nombre..." autocomplete="off">
            <table class="tabla-productos">
                <thead>
                    <tr>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Categoría</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-body">
                    <!-- Productos cargados por JS -->
                </tbody>
            </table>
        </section>

    </main>

    <script src="/public/js/admin.js" defer></script>
</body>
</html>
