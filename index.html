<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda Online</title>
    <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <img src="/public/images/logo.png" alt="Logo de la tienda" class="logo">
            <a href="login.html" class="btn-secondary" target="_blank">Acceso Admin</a>
        </div>
        <div class="contact-info">
            <a href="https://wa.me/5493435250008?text=Hola!%20Quisiera%20consultar%20por%20un%20producto" target="_blank" class="btn-whatsapp-flotante" aria-label="Contactar por WhatsApp">
                <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true">
                    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg>
            </a>            
        </div>
    </header>
    <div class="noticias"></div>
        <section id="carrusel" class="carrusel" aria-label="Imágenes destacadas" hidden></section>
    </div>
    <!-- Buscador y filtro por categoría -->
    <div class="filtros">
        <input type="search" id="buscador" placeholder="🔍 Buscar producto por nombre..." autocomplete="off">
        <select id="filtro-categoria" >
            <option value="">Todas las categorías</option>
        </select>
    </div>
    <main class="container">
        <h2>Nuestros Productos</h2>
        <div id="productos-grid" class="grid-productos">
            <p>Cargando productos...</p>
        </div>
    </main>

    <script src="/public/js/main.js"></script>
    <script src="/public/js/carrusel.js"></script>
</body>
</html>
